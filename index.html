<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muho Penaltı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&display=swap">
<style>
/* Tek görünüm: gece halı saha. Skor tabelası üstte, saha kanvası altta. */
:root{
  --night:#070c0a; --panel:#101a15; --line:#24352c;
  --turf:#3fae35; --yellow:#f2b51c; --white:#f4f6f2; --muted:#93a89b;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--night);color:var(--white);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:10px}
h1{margin:0;font-size:clamp(28px,6vw,44px);font-weight:800;letter-spacing:.02em;line-height:1;text-transform:uppercase}
h1 span{color:var(--yellow)}
.board{display:flex;gap:6px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 12px;text-align:center;min-width:64px}
.cell b{display:block;font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.cell small{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.cell.goal b{color:var(--yellow)}
canvas{width:100%;max-width:100%;aspect-ratio:8/5;display:block;border-radius:8px;cursor:crosshair;touch-action:manipulation;background:#0c1612}
.msg{min-height:1.4em;font-size:clamp(18px,3.6vw,24px);font-weight:700;text-align:center}
.hint{color:var(--muted);font-size:14px;letter-spacing:.06em;text-align:center;margin:0}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Muho <span>Penaltı</span></h1>
    <div class="board">
      <div class="cell"><b id="shots">0</b><small>Atış</small></div>
      <div class="cell goal"><b>0</b><small>Gol</small></div>
      <div class="cell"><b id="miss">0</b><small>Kaçan</small></div>
    </div>
  </header>
  <canvas id="c" width="800" height="500" aria-label="Penaltı sahası. Kaleye dokunarak nişan al."></canvas>
  <div class="msg" id="msg">Kalede bir yere dokun, Muho oraya vursun.</div>
  <p class="hint">Nereye nişan alırsan al, sonuç belli.</p>
</div>

<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const W=800,H=500;
function fit(){const d=Math.min(window.devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
fit();addEventListener('resize',fit);

const GL=250,GR=550,GT=155,GB=302,SPOT={x:400,y:402};
const MSGS={
 over:["Top Kadıköy'e gitti.","Uydu yörüngesine oturdu.","Yan sitedeki balkona selam.","Harun topun gidişini bakışlarıyla uğurladı."],
 wide:["Kale orada, Muho burada.","Korner bayrağını hedefledi galiba.","Otoparktaki arabalar tehlikede.","Harun yerinden kıpırdamadı bile."],
 post:["Direk! Tıng sesi bütün mahalleye duyuldu.","Direkten döndü. Muho direkle küs.","Direk! Harun direğe teşekkür ediyor."],
 bar:["Üst direk! Bir karış daha aşağı...","Üst direkten havalara.","Üst direk! Harun gülmemek için zor duruyor."],
 save:["Harun rahat aldı.","Harun çay bardağını bırakmadan çıkardı.","Harun uçtu, Muho düştü.","Harun: \"Başka var mı?\""],
 whiff:["Muho topu ıskaladı, çimi vurdu.","Hava atışı. Kelimenin tam anlamıyla.","Muho ıskaladı, Harun alkışlıyor."],
 slow:["Top Harun'a pas gibi gitti.","Harun eğilip aldı, teşekkür etti.","Harun topu alırken esnedi."]
};
const pick=a=>a[Math.random()*a.length|0];
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=t=>1-Math.pow(1-t,2);

let shots=0,misses=0,state='idle',t0=0,aim=null,type=null,hover=null;
let ball,keeper,muho,flight;

function reset(){
  ball={x:SPOT.x,y:SPOT.y-6,r:9,gy:SPOT.y};
  keeper={x:400,y:GB-2,ang:0,lift:0};
  muho={x:330,y:482,s:1,run:0,kick:0,fall:0};
  state='idle';aim=null;
}
reset();

function chooseType(){
  const r=Math.random();
  if(r<.17)return'over';if(r<.32)return'wide';if(r<.46)return'post';
  if(r<.58)return'bar';if(r<.78)return'save';if(r<.89)return'whiff';return'slow';
}

function planFlight(){
  const left=aim.x<400, sx=left?-1:1;
  const st={x:SPOT.x,y:SPOT.y-6,r:9,gy:SPOT.y};
  let legs=[],kTo=null,kDelay=.15;
  const ay=clamp(aim.y,GT+15,GB-12);
  switch(type){
   case'over':legs=[{to:{x:clamp(aim.x,270,530),y:-40,r:4,gy:GB},d:.75,arc:40}];kTo={x:400+sx*-90};break;
   case'wide':legs=[{to:{x:left?185:615,y:255,r:5,gy:GB-10},d:.7,arc:30},{to:{x:left?120:680,y:268,r:5,gy:GB-8},d:.6,arc:6}];kTo={x:400+sx*-90};break;
   case'post':{const px=left?GL+3:GR-3;legs=[{to:{x:px,y:ay,r:5.5,gy:GB},d:.6,arc:25},{to:{x:px-sx*-1*0+(left?-60:60)*-1,y:380,r:8,gy:385},d:.6,arc:35},{to:{x:left?240:560,y:430,r:9,gy:432},d:.5,arc:8}];kTo={x:400-sx*90};break;}
   case'bar':legs=[{to:{x:clamp(aim.x,280,520),y:GT+2,r:5,gy:GB},d:.6,arc:20},{to:{x:clamp(aim.x,280,520)+sx*40,y:-40,r:4,gy:GB},d:.6,arc:0}];kTo={x:400-sx*80};break;
   case'save':{const tx=clamp(aim.x,GL+30,GR-30);legs=[{to:{x:tx,y:ay,r:5.5,gy:GB},d:.6,arc:20}];kTo={x:tx,y:ay,save:true};kDelay=.05;break;}
   case'whiff':legs=[{to:{x:SPOT.x+6,y:SPOT.y-14,r:8.6,gy:SPOT.y-8},d:1.2,arc:0}];kTo={x:400+sx*80};kDelay=.3;break;
   case'slow':legs=[{to:{x:402,y:GB-4,r:5.5,gy:GB},d:2.4,arc:0}];kTo=null;break;
  }
  flight={st,legs,leg:0,lt:0,kTo,kDelay,kt:0};
}

cv.addEventListener('pointermove',e=>{hover=toLocal(e)});
cv.addEventListener('pointerleave',()=>hover=null);
cv.addEventListener('pointerdown',e=>{
  if(state!=='idle')return;
  const p=toLocal(e);
  aim={x:clamp(p.x,GL-40,GR+40),y:clamp(p.y,GT-40,GB)};
  type=chooseType();state='run';t0=performance.now();
  document.getElementById('msg').textContent='Muho topun başında...';
});
function toLocal(e){const b=cv.getBoundingClientRect();return{x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height};}

let last=performance.now();
function tick(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  const el=(now-t0)/1000;
  if(state==='run'){
    const t=Math.min(1,el/.6);
    muho.x=lerp(330,378,t);muho.y=lerp(482,418,t);muho.s=lerp(1,.88,t);muho.run=Math.sin(el*22);
    if(t>=1){state='kick';t0=now;planFlight();}
  }else if(state==='kick'){
    muho.run=0;muho.kick=Math.min(1,el/.12);
    if(type==='whiff')muho.fall=Math.min(.9,Math.max(0,(el-.15)*2.2));
    const f=flight;
    if(el>.08){
      const L=f.legs[f.leg];f.lt+=dt;
      const p=Math.min(1,f.lt/L.d), e=type==='slow'?p:ease(p);
      const from=f.leg===0?f.st:f.legs[f.leg-1].to;
      ball.x=lerp(from.x,L.to.x,e);ball.y=lerp(from.y,L.to.y,e)-Math.sin(Math.PI*p)*L.arc;
      ball.r=lerp(from.r,L.to.r,e);ball.gy=lerp(from.gy,L.to.gy,e);
      if(p>=1){if(f.leg<f.legs.length-1){f.leg++;f.lt=0;}else if(state==='kick'){state='done';t0=now;finish();}}
    }
    moveKeeper(dt);
  }else if(state==='done'){
    moveKeeper(dt);
    if(type==='slow'){keeper.lift=Math.min(1,el*2);}
    if(el>2.6)reset();
  }
  draw();requestAnimationFrame(tick);
}
function moveKeeper(dt){
  const f=flight;if(!f||!f.kTo)return;f.kt+=dt;
  const p=clamp((f.kt-f.kDelay)/.5,0,1),e=ease(p);const k=f.kTo;
  const dir=Math.sign(k.x-400)||1;
  if(k.save){
    keeper.x=lerp(400,k.x-dir*22,e);
    keeper.y=lerp(GB-2,clamp(k.y+46,GB-50,GB-2),e);
    keeper.ang=dir*e*clamp((GB-k.y)/120,.35,1.3);
    if(state!=='kick'||f.lt>0){} // top ellipse holds
  }else{
    keeper.x=lerp(400,k.x,e);keeper.ang=dir*e*1.25;keeper.y=GB-2-Math.sin(Math.PI*Math.min(p,1))*18;
  }
}
function finish(){
  shots++;misses++;
  document.getElementById('shots').textContent=shots;
  document.getElementById('miss').textContent=misses;
  let m=pick(MSGS[type]);
  if(misses===5)m+=' 5/5. Harun bugün geçit vermiyor.';
  if(misses===10)m+=' 10 atış, 0 gol. Harun rekor kırdı.';
  document.getElementById('msg').textContent=m;
}

/* ---------- çizim ---------- */
function draw(){
  // gece + çit
  let g=ctx.createLinearGradient(0,0,0,GB);g.addColorStop(0,'#05080a');g.addColorStop(1,'#0f1c17');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,GB);
  // uzak ışıklar
  [[40,90],[150,150],[230,175],[520,210],[560,215],[470,230]].forEach(([x,y])=>glow(x,y,26,'rgba(255,170,60,.55)'));
  // binalar / park arabaları silüeti
  ctx.fillStyle='#141c1a';ctx.fillRect(620,190,180,112);
  ctx.fillStyle='rgba(255,236,190,.55)';ctx.fillRect(705,205,40,14);ctx.fillRect(705,228,40,14);
  ctx.fillStyle='#1d2624';[[600,262,70],[690,265,60],[760,262,50],[480,268,55]].forEach(([x,y,w])=>{rr(x,y,w,20,6);ctx.fill();});
  ctx.fillStyle='#4a524f';rr(330,262,80,22,7);ctx.fill();
  // çit ağı
  ctx.strokeStyle='rgba(120,150,135,.10)';ctx.lineWidth=1;
  for(let i=-300;i<W+300;i+=14){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+GB,GB);ctx.stroke();ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i-GB,GB);ctx.stroke();}
  ctx.strokeStyle='#26332e';ctx.lineWidth=4;
  for(let x=40;x<W;x+=150){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,GB);ctx.stroke();}
  ctx.beginPath();ctx.moveTo(0,40);ctx.lineTo(W,25);ctx.stroke();
  // projektör
  ctx.fillStyle='#2a3430';ctx.fillRect(668,40,4,262);
  glow(670,36,140,'rgba(255,255,235,.35)');glow(670,36,30,'rgba(255,255,255,.95)');
  ctx.fillStyle='#fff';rr(648,28,44,14,4);ctx.fill();

  // çim
  g=ctx.createLinearGradient(0,GB,0,H);g.addColorStop(0,'#2c8a28');g.addColorStop(1,'#46b83a');
  ctx.fillStyle=g;ctx.fillRect(0,GB,W,H-GB);
  let y=GB,h=10,i=0;while(y<H){if(i%2){ctx.fillStyle='rgba(0,0,0,.06)';ctx.fillRect(0,y,W,h);}y+=h;h*=1.25;i++;}
  // çizgiler
  ctx.strokeStyle='rgba(245,248,240,.92)';ctx.lineCap='round';
  line(0,GB+1,W,GB-1,3);line(150,GB+1,40,460,4);line(650,GB+1,760,460,4);line(40,460,760,460,5);
  ctx.fillStyle='rgba(245,248,240,.9)';ctx.beginPath();ctx.ellipse(SPOT.x,SPOT.y,7,3,0,0,7);ctx.fill();

  // kale arka ağ
  ctx.strokeStyle='rgba(240,240,240,.35)';ctx.lineWidth=1;
  const bl=272,br=528,bt=178;
  for(let x=GL;x<=GR;x+=10){ctx.beginPath();ctx.moveTo(x,GT);ctx.lineTo(lerp(bl,br,(x-GL)/(GR-GL)),bt);ctx.lineTo(lerp(bl,br,(x-GL)/(GR-GL)),GB-6);ctx.stroke();}
  for(let yy=bt;yy<=GB-6;yy+=10){ctx.beginPath();ctx.moveTo(bl,yy);ctx.lineTo(br,yy);ctx.stroke();}
  for(let yy=GT;yy<GB;yy+=10){const k=(yy-GT)/(GB-GT);ctx.beginPath();ctx.moveTo(GL,yy);ctx.lineTo(bl,lerp(bt,GB-6,k));ctx.stroke();ctx.beginPath();ctx.moveTo(GR,yy);ctx.lineTo(br,lerp(bt,GB-6,k));ctx.stroke();}

  const ballBehindGoal=state!=='idle'&&(type==='over'||type==='bar'||type==='wide')&&ball.y<GB-6;
  if(ballBehindGoal)drawBall();
  drawKeeper();
  // direkler
  ctx.fillStyle='#f6f6f2';ctx.fillRect(GL-4,GT-3,8,GB-GT+3);ctx.fillRect(GR-4,GT-3,8,GB-GT+3);ctx.fillRect(GL-4,GT-4,GR-GL+8,8);
  if(type==='save'&&state==='done'){/* top kalecide */}

  // nişan
  if(state==='idle'&&hover&&hover.y<GB+20){
    ctx.strokeStyle='rgba(242,181,28,.9)';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(hover.x,hover.y,12,0,7);ctx.stroke();
    line(hover.x-18,hover.y,hover.x-6,hover.y,2);line(hover.x+6,hover.y,hover.x+18,hover.y,2);
    line(hover.x,hover.y-18,hover.x,hover.y-6,2);line(hover.x,hover.y+6,hover.x,hover.y+18,2);
  }
  if(aim&&state!=='done'){ctx.strokeStyle='rgba(242,181,28,.45)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(aim.x,aim.y,10,0,7);ctx.stroke();}

  if(!ballBehindGoal)drawBall();
  drawMuho();
}
function drawBall(){
  const b=ball;
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(b.x,b.gy,b.r*.9,b.r*.3,0,0,7);ctx.fill();
  ctx.fillStyle='#f3f1ea';ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
  ctx.fillStyle='#2b2b2b';ctx.beginPath();ctx.arc(b.x+b.r*.15,b.y-b.r*.1,b.r*.32,0,7);ctx.fill();
  ctx.beginPath();ctx.arc(b.x-b.r*.6,b.y+b.r*.45,b.r*.22,0,7);ctx.fill();
}
function drawKeeper(){
  const k=keeper;ctx.save();ctx.translate(k.x,k.y);ctx.rotate(k.ang);ctx.scale(.62,.62);
  const bend=type==='slow'&&state==='done'?keeper.lift:0;
  ctx.lineCap='round';
  // bacaklar
  limb(-9,-48,-16,0,9,'#111');limb(9,-48,16,0,9,'#111');
  boot(-16,0,'#3ccf3c');boot(16,0,'#3ccf3c');
  ctx.fillStyle='#e9ab17';rr(-18,-64,36,20,4);ctx.fill();
  // gövde
  ctx.save();ctx.translate(0,-62);ctx.rotate(bend*.5);
  ctx.fillStyle='#f2b51c';rr(-19,-44,38,46,7);ctx.fill();
  ctx.fillStyle='#2b2412';ctx.fillRect(-19,-30,38,5);
  // kollar (yukarı açık)
  limb(-17,-38,-40,-58+bend*50,8,'#f2b51c');limb(17,-38,40,-58+bend*50,8,'#f2b51c');
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-41,-60+bend*50,7,0,7);ctx.arc(41,-60+bend*50,7,0,7);ctx.fill();
  ctx.fillStyle='#c98f68';ctx.beginPath();ctx.arc(0,-56,12,0,7);ctx.fill();
  ctx.fillStyle='#1d140e';ctx.beginPath();ctx.arc(0,-60,12,Math.PI*1.05,Math.PI*1.95);ctx.fill();ctx.fillRect(-12,-62,24,4);
  ctx.restore();ctx.restore();
  if(type==='save'&&(state==='done'||(flight&&flight.legs[0]&&flight.lt>=flight.legs[0].d*.95))){/* ball held: drawn at same spot */}
}
function drawMuho(){
  const m=muho;ctx.save();ctx.translate(m.x,m.y);ctx.rotate(-m.fall);ctx.scale(m.s,m.s);
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.beginPath();ctx.ellipse(0,2,30,7,0,0,7);ctx.fill();
  ctx.lineCap='round';
  const r=m.run*10,k=m.kick;
  // sol bacak (destek)
  limb(-9,-56,-12+r,0,10,'#d9b08f');ctx.strokeStyle='#111';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-11+r*.8,-22);ctx.lineTo(-12+r,0);ctx.stroke();
  boot(-12+r,0,'#2a7fd1');
  // sağ bacak (vuruş)
  const fx=lerp(12-r,22,k),fy=lerp(0,-26,k);
  limb(9,-56,fx,fy,10,'#d9b08f');ctx.strokeStyle='#111';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(lerp(9,fx,.6),lerp(-56,fy,.6));ctx.lineTo(fx,fy);ctx.stroke();
  boot(fx,fy,'#2a7fd1');
  // şort
  ctx.fillStyle='#141414';rr(-19,-72,38,22,4);ctx.fill();
  ctx.fillStyle='#fff';ctx.font='700 9px sans-serif';ctx.fillText('9',8,-58);
  // kollar
  const as=m.run*14+k*18;
  limb(-18,-112,-40,-74-as,9,'#3a2a22');limb(18,-112,42,-80+as,9,'#3a2a22');
  ctx.fillStyle='#d9b08f';ctx.beginPath();ctx.arc(-40,-73-as,5,0,7);ctx.arc(42,-79+as,5,0,7);ctx.fill();
  // forma (arkadan)
  ctx.fillStyle='#b9bcbe';rr(-21,-120,42,52,8);ctx.fill();
  ctx.fillStyle='#2c2c2c';ctx.textAlign='center';
  ctx.font='700 9px "Saira Condensed",sans-serif';ctx.fillText('MUHO',0,-104);
  ctx.font='800 26px "Saira Condensed",sans-serif';ctx.fillText('05',0,-78);
  // kafa
  ctx.fillStyle='#d9b08f';ctx.fillRect(-5,-126,10,8);
  ctx.fillStyle='#5a3f2c';ctx.beginPath();ctx.arc(0,-136,13,0,7);ctx.fill();
  ctx.fillStyle='#d9b08f';ctx.beginPath();ctx.ellipse(-12,-134,3,5,0,0,7);ctx.ellipse(12,-134,3,5,0,0,7);ctx.fill();
  ctx.restore();ctx.textAlign='left';
}
function limb(x1,y1,x2,y2,w,c){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function boot(x,y,c){ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y-2,7,5,0,0,7);ctx.fill();}
function line(a,b,c,d,w){ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a,b);ctx.lineTo(c,d);ctx.stroke();}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function glow(x,y,r,c){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}

requestAnimationFrame(tick);
</script>
</body>
</html>
